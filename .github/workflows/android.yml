name: Ayan Agent — Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # NDK: the vendored Termux terminal-emulator module builds its JNI
      # PTY library (libtermux.so) with ndkBuild, so the build needs the NDK
      # (same version Termux itself uses: 29.0.14206865, see gradle.properties).
      # The runner already has the Android SDK; install the NDK with its
      # sdkmanager directly.
      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # The job log API needs admin rights, so save the Gradle log as an
      # artifact instead — it shows the exact error when the build fails.
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-log
          path: build.log

      # Unit tests (Robolectric): launch crash test + setup fix test.
      # They reproduce the reported failures on the JVM and fail with the
      # real stack trace if anything in those paths throws.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.ayan.agent.*" --stacktrace

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/

      - name: Prepare release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ayan-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ayan-agent-release
          # Signed release APK (app-release.apk) when the keystore secret is
          # present; falls back to whatever release APK was built otherwise.
          path: app/build/outputs/apk/release/*.apk
